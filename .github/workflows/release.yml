name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-package-artifacts.mjs
      - name: Pack release assets
        run: |
          mkdir -p artifacts
          npm_config_ignore_scripts=true npm pack --pack-destination artifacts > "$RUNNER_TEMP/npm-pack.log"
          pkg_file="$(find artifacts -maxdepth 1 -type f -name 'switchboard-cli-*.tgz' -print -quit)"
          if [ -z "$pkg_file" ]; then
            cat "$RUNNER_TEMP/npm-pack.log"
            exit 1
          fi
          cp "$pkg_file" artifacts/switchboard-cli.tgz
          cp install.sh artifacts/install.sh
          (
            cd artifacts
            sha256sum *.tgz install.sh > SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME" --verify-tag
          fi
